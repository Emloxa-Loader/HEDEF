<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gizli Mesaj Şifreleyici</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--accent);
      text-align: center;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    textarea, input {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus, input:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-encrypt {
      background: var(--accent);
      color: #000;
    }
    .btn-decrypt {
      background: #10b981;
      color: #000;
    }
    .result-box {
      background: #0b1120;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 14px;
      position: relative;
    }
    .result-text {
      word-break: break-all;
      font-family: monospace;
      font-size: 0.95rem;
      min-height: 40px;
      white-space: pre-wrap;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--border);
      color: var(--text);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .copy-btn:hover {
      background: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Mesaj Kasası</h1>
  <p class="subtitle">Yalnızca bu anahtar ve bu sayfayla çözülebilir.</p>

  <label for="password">Gizli Anahtar (Şifre)</label>
  <input type="password" id="password" placeholder="Mesajı kilitleyecek özel kelime...">

  <label for="inputText">Metin / Şifreli Kod</label>
  <textarea id="inputText" placeholder="Şifrelemek veya çözmek istediğin metni buraya yapıştır..."></textarea>

  <div class="btn-group">
    <button class="btn-encrypt" onclick="process(true)">🔒 Şifrele</button>
    <button class="btn-decrypt" onclick="process(false)">🔓 Şifreyi Çöz</button>
  </div>

  <label>Sonuç</label>
  <div class="result-box">
    <button class="copy-btn" onclick="copyResult()">Kopyala</button>
    <div id="outputText" class="result-text">İşlem sonucu burada görünecek...</div>
  </div>
</div>

<script>
  // Özel XOR + Base64 Algoritması (Türkçe karakter destekli)
  function xorCipher(text, key) {
    let result = '';
    for (let i = 0; i < text.length; i++) {
      const charCode = text.charCodeAt(i) ^ key.charCodeAt(i % key.length);
      result += String.fromCharCode(charCode);
    }
    return result;
  }

  function process(isEncrypt) {
    const text = document.getElementById('inputText').value;
    const key = document.getElementById('password').value;
    const output = document.getElementById('outputText');

    if (!text || !key) {
      alert('Lütfen hem metin hem de bir gizli anahtar (şifre) girin.');
      return;
    }

    try {
      if (isEncrypt) {
        // Şifreleme: Metni UTF-8'e çevir -> Anahtar ile XOR uygula -> Base64 kodla
        const utf8Text = encodeURIComponent(text);
        const encrypted = xorCipher(utf8Text, key);
        output.textContent = btoa(encrypted);
      } else {
        // Çözme: Base64 çöz -> Anahtar ile ters XOR uygula -> UTF-8'e dönüştür
        const decodedBase64 = atob(text.trim());
        const decrypted = xorCipher(decodedBase64, key);
        output.textContent = decodeURIComponent(decrypted);
      }
    } catch (e) {
      output.textContent = "Hata: Yanlış anahtar girdiniz veya şifreli metin bozuk!";
    }
  }

  function copyResult() {
    const text = document.getElementById('outputText').textContent;
    if (!text || text.startsWith("İşlem sonucu") || text.startsWith("Hata")) return;
    navigator.clipboard.writeText(text).then(() => {
      alert('Sonuç panoya kopyalandı.');
    });
  }
</script>

</body>
</html>
